<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Cavite Rentals</title>
    <style>
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
            background: #0d1117; color: #e6edf3; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { font-size: 1.35rem; margin: 18px 0 8px; }
        p { margin: 0 auto 22px; max-width: 300px; color: #9ca3af; line-height: 1.5; }
        button { background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: .95rem; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Cavite Rentals needs an internet connection to load your listings and applications. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
